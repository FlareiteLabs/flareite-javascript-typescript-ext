# TypeScript and JavaScript (with TSX and JSX): highlighting from Tree-sitter
# grammars compiled to WebAssembly, and typescript-language-server for all
# four. No code. See Flareite's docs/extensions.md#languages.
id = "flareite.typescript"
name = "TypeScript & JavaScript"
version = "0.3.0"
description = "TypeScript, TSX, JavaScript, and JSX highlighting, and typescript-language-server."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

[permissions]
language_servers = true

[[languages]]
id = "typescript"
name = "TypeScript"
file_extensions = ["ts", "mts", "cts"]
grammar = "grammars/tree-sitter-typescript.wasm"
highlights = "queries/typescript/highlights.scm"
folds = "queries/typescript/folds.scm"
line_comment = "//"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["${", "}"], ["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  { open = "'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = '"', close = '"', not_in = [
    "string",
  ] },
  { open = "`", close = "`", not_in = [
    "string",
    "comment",
  ] },
  { open = "/**", close = " */", not_in = [
    "string",
  ] },
]
surrounding_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  [
    "'",
    "'",
  ],
  [
    '"',
    '"',
  ],
  [
    "`",
    "`",
  ],
  [
    "<",
    ">",
  ],
]
auto_close_before = ";:.,=}])>`"

[[languages]]
# The LSP id for TSX.
id = "typescriptreact"
name = "TypeScript JSX"
file_extensions = ["tsx"]
grammar = "grammars/tree-sitter-tsx.wasm"
grammar_name = "tsx"
highlights = "queries/tsx/highlights.scm"
folds = "queries/tsx/folds.scm"
line_comment = "//"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["${", "}"], ["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  { open = "'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = '"', close = '"', not_in = [
    "string",
  ] },
  { open = "`", close = "`", not_in = [
    "string",
    "comment",
  ] },
  { open = "/**", close = " */", not_in = [
    "string",
  ] },
]
surrounding_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  [
    "'",
    "'",
  ],
  [
    '"',
    '"',
  ],
  [
    "`",
    "`",
  ],
  [
    "<",
    ">",
  ],
]
auto_close_before = ";:.,=}])>`"

# JSX too: the JavaScript grammar parses it.
[[languages]]
id = "javascript"
name = "JavaScript"
file_extensions = ["js", "mjs", "cjs", "jsx"]
grammar = "grammars/tree-sitter-javascript.wasm"
highlights = "queries/javascript/highlights.scm"
folds = "queries/javascript/folds.scm"
line_comment = "//"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["${", "}"], ["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  { open = "'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = '"', close = '"', not_in = [
    "string",
  ] },
  { open = "`", close = "`", not_in = [
    "string",
    "comment",
  ] },
  { open = "/**", close = " */", not_in = [
    "string",
  ] },
]
surrounding_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  [
    "'",
    "'",
  ],
  [
    '"',
    '"',
  ],
  [
    "`",
    "`",
  ],
  [
    "<",
    ">",
  ],
]
auto_close_before = ";:.,=}])>`"

# `npm install -g typescript-language-server typescript`
[[language_servers]]
name = "typescript-language-server"
command = "typescript-language-server"
args = ["--stdio"]
languages = ["typescript", "typescriptreact", "javascript"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
